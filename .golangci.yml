run:
  timeout: 5m
  tests: true

linters:
  enable:
    - errcheck
    - goimports
    - gosec
    - govet
    - ineffassign
    - misspell
    - staticcheck
    - typecheck
    - unconvert
    - unused

linters-settings:
  goimports:
    local-prefixes: github.com/potrit
  misspell:
    locale: US